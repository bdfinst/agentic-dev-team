name: agent-eval-gate

# Agent-eval regression gate (issue #99).
#
# The review agents are the non-deterministic, untested part of the system.
# /agent-eval verifies their detection accuracy but only runs when a human
# remembers. This gate runs on every PR that touches the agents, skills,
# knowledge, or the eval corpus itself.
#
# Two tiers, by design:
#   1. STRUCTURAL gate (always, model-free): corpus integrity + the
#      deterministic grader's own unit tests. Cheap, hermetic, never flakes.
#   2. LIVE gate (only when ANTHROPIC_API_KEY is configured): actually
#      dispatches the agents against the fixtures, grades the recorded
#      outputs against evals/expected/*.json, and fails on any regression
#      vs evals/baseline.json. Costs model tokens, so it is opt-in via the
#      presence of the secret and degrades gracefully (skipped, not failed)
#      when the model API is unavailable.

on:
  pull_request:
    # No 'paths' filter, on purpose. The structural + semver jobs are REQUIRED
    # status checks. A path-filtered workflow reports NO status on PRs that don't
    # match the filter, so a required check from it deadlocks every unrelated PR
    # at "Expected — Waiting for status to be reported" (it can never go green).
    # Both free gates are cheap and hermetic, so they run on every PR and always
    # report. The paid live gate is opt-in, self-gated below by the 'run-eval'
    # label / ANTHROPIC_API_KEY presence; 'labeled' lets the label trigger it.
    types: [opened, synchronize, reopened, labeled]
  # Manual trigger; force_live=true runs the live gate without the label.
  workflow_dispatch:
    inputs:
      force_live:
        description: "Run the live agent-eval gate for this run (needs ANTHROPIC_API_KEY)"
        type: boolean
        default: false
      force_integration:
        description: "Run the integration eval tier for this run (needs ANTHROPIC_API_KEY)"
        type: boolean
        default: false

# Cancel superseded runs on the same ref so rapid pushes don't stack paid runs.
concurrency:
  group: agent-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural-gate:
    name: Structural gate (model-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Restore the apt download cache so a warm run skips re-fetching the .deb
      # archives. apt-get update still refreshes the lists. (Issue #467.)
      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq

      - name: Eval corpus integrity check
        run: python3 scripts/eval_grade.py --check-corpus

      - name: Grader, cache & integration-tier unit tests
        run: |
          bats tests/repo/eval_grader_tests.bats \
               tests/repo/eval_cache_tests.bats \
               tests/repo/integration_tier_tests.bats \
               tests/repo/citation_lint_tests.bats

      # Citation drift lint (#312). Advisory in Phase 1 — always exits 0, so it
      # surfaces drift warnings in the log without blocking the gate.
      - name: Citation drift lint (advisory)
        run: python3 scripts/citation_lint.py --all

  semver-contract:
    # Job name is a REQUIRED status-check context (renovate-require-tests
    # ruleset). Keep it paren-free and issue-number-free so it is stable and
    # can't be truncated mid-token when typed into branch rules. (Issue #101.)
    name: Eval-corpus prompt-semver gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify corpus change vs. commit type
        run: |
          # The eval corpus is the prompt's semver contract: editing an
          # existing expected value is a behavioral break (major); adding new
          # expectations is additive (minor); GREEN-preserving is patch. Assert
          # the PR's conventional-commit type matches.
          bash scripts/eval_semver_classify.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  live-gate:
    name: Live regression gate (model-dependent)
    runs-on: ubuntu-latest
    needs: structural-gate
    # The live gate dispatches the agents through the bare `claude` CLI (see the
    # dispatch step below), which authenticates from ANTHROPIC_API_KEY — no OIDC
    # token and no PR-comment write are needed, so the only permission required
    # is read access to the repo. (The integration tier already dispatches the
    # orchestrator via the bare CLI and runs with `contents: read` alone.)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need PR base to diff which agents/skills changed

      - name: Decide whether to run the live gate
        id: cred
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The live gate dispatches the real agents (costs tokens). It runs
          # only when a PR carries the 'run-eval' label (per-PR opt-in) or via
          # a manual force_live dispatch. The API key must also be present.
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-eval') }}
          FORCE_LIVE: ${{ github.event.inputs.force_live }}
        run: |
          if { [ "$HAS_LABEL" = "true" ] || [ "$FORCE_LIVE" = "true" ]; } \
             && [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "run_live=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Live gate not triggered — notice (structural gate still ran)
        if: steps.cred.outputs.run_live != 'true'
        run: |
          echo "::notice title=agent-eval live gate not triggered::" \
            "The model-free structural gate ran. Add the 'run-eval' label to" \
            "this PR (or dispatch with force_live) to run the paid live agent" \
            "regression gate. See issue #99 and evals/README.md."

      # --- Live path (opt-in via RUN_LIVE_AGENT_EVAL) ----------------------
      # Budget: a 1-trial smoke run over the fixtures touched by the PR. The
      # runner records each agent's JSON output into actuals.json (keyed by
      # fixture stem), then the deterministic grader compares against
      # evals/baseline.json and fails the job on any regression with a
      # readable diff. Multi-trial quorum and per-agent thresholds are layered
      # in by issue #103's variance data.
      - name: Install tooling
        if: steps.cred.outputs.run_live == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      # The agent-eval skill reads fixtures from .claude/evals/{fixtures,
      # expected}/, but this repo stores them at evals/. Symlink them into
      # place so the skill finds the corpus in CI.
      - name: Stage fixtures where the skill expects them
        if: steps.cred.outputs.run_live == 'true'
        run: |
          mkdir -p .claude/evals
          ln -sfn "$PWD/evals/fixtures" .claude/evals/fixtures
          ln -sfn "$PWD/evals/expected" .claude/evals/expected

      # Per-pair fingerprint replay cache (#311). Restore the branch's cache
      # BEFORE dispatch so unchanged pairs replay at zero token cost. Keyed per
      # branch with a rolling suffix; restore-keys fall back to the latest cache
      # for the same branch. A miss here just means a full live dispatch.
      - name: Restore eval replay cache
        if: steps.cred.outputs.run_live == 'true'
        uses: actions/cache@v5
        with:
          path: evals/.eval-cache.json
          key: eval-cache-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            eval-cache-${{ github.head_ref || github.ref_name }}-

      # Diff-scope: run only the agents/skills the PR changed. A broad change
      # (knowledge, the corpus, the grader, or this workflow) or a dispatch
      # with no PR base falls back to a full run, since one knowledge file can
      # feed many agents.
      - name: Detect changed eval targets
        id: scope
        if: steps.cred.outputs.run_live == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          full() { echo "only=" >> "$GITHUB_OUTPUT"; echo "instruction=" >> "$GITHUB_OUTPUT"; echo "scope=full" >> "$GITHUB_OUTPUT"; }
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then full; exit 0; fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$changed" | grep -qE '^(plugins/dev-team/knowledge/|evals/|scripts/eval_grade\.py|scripts/eval_graders/|scripts/eval_cache\.py|\.github/workflows/agent-eval\.yml)'; then
            full; exit 0
          fi
          agents=$(echo "$changed" | sed -n 's#^plugins/dev-team/agents/\([^/]*\)\.md$#\1#p')
          skills=$(echo "$changed" | sed -n 's#^plugins/dev-team/skills/\([^/]*\)/.*#\1#p')
          only=$(printf '%s\n%s\n' "$agents" "$skills" | sed '/^$/d' | sort -u | paste -sd, -)
          if [ -z "$only" ]; then full; exit 0; fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "scope=scoped" >> "$GITHUB_OUTPUT"
          echo "instruction=IMPORTANT: restrict this run to ONLY these agents/skills and skip all others: $only" >> "$GITHUB_OUTPUT"
          echo "::notice title=diff-scoped agent-eval::Running only: $only"

      # Classify pairs against the restored cache (#311): cache hits replay from
      # evals/.eval-cache.json (written to replay.json) and are skipped during
      # dispatch; only misses pay token cost. Resilient — a missing/corrupt cache
      # yields all-misses (full dispatch), never an error.
      - name: Plan cache replay (skip unchanged pairs)
        id: cacheplan
        if: steps.cred.outputs.run_live == 'true'
        run: |
          python3 scripts/eval_cache.py --plan \
            --only "${{ steps.scope.outputs.only }}" \
            --plan-out plan.json --replay-out replay.json
          hits=$(jq -r '.hits | join(", ")' plan.json 2>/dev/null || echo "")
          nhits=$(jq -r '.hits | length' plan.json 2>/dev/null || echo 0)
          nmiss=$(jq -r '.misses | length' plan.json 2>/dev/null || echo 0)
          if [ -n "$hits" ]; then
            printf 'cache_skip=NOTE: these fixture::target pairs are unchanged since the last green run and are replayed from cache — DO NOT dispatch them, skip them entirely: %s\n' \
              "$hits" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice title=eval replay cache::${nhits} hit(s) replayed, ${nmiss} miss(es) dispatched"

      # Dispatch the review agents headlessly via the bare `claude` CLI — NOT via
      # anthropics/claude-code-action. The action wraps the CLI in a Bun runtime
      # that crashes at launch in CI ("directory mismatch for tsconfig.json",
      # fd 4 / "Claude Code process exited with code 1") before any API call. It
      # is an upstream bug — anthropics/claude-code-action#1205 (closed
      # 2026-06-09 but the symptom persists) and #1295 (still open). It is NOT
      # fixable on our side: the `@v1` pin already resolves to the latest release
      # and still crashes, and pinning a CLI version / a custom node executable
      # both crashed identically (PRs #161, #162). The integration tier below
      # already dispatches the orchestrator through the bare CLI for the same
      # reason; this mirrors that pattern.
      #
      # The CLI authenticates from ANTHROPIC_API_KEY and the model writes its RAW
      # agent outputs to actuals.json in the grader's input shape (see
      # scripts/eval_grade.py header). Grading stays in the deterministic grader
      # below — this step only records. Secret exposure is bounded by the
      # maintainer-applied 'run-eval' label gate above (same model as the
      # integration tier); unlike the action there is no self-skip on
      # workflow-modifying PRs, so the gate can be exercised on its own PR.
      - name: Install the claude CLI and the dev-team plugin
        if: steps.cred.outputs.run_live == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code || true
          command -v claude >/dev/null \
            || { echo "::error title=claude CLI missing::npm install of @anthropic-ai/claude-code failed; the live gate cannot dispatch."; exit 1; }
          # Install the plugin from the in-repo marketplace so its skills/agents
          # are discoverable to the headless run.
          claude plugin marketplace add "$PWD"
          claude plugin install dev-team@bfinster

      - name: Run agent-eval (records actuals.json)
        if: steps.cred.outputs.run_live == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Dynamic directives flow in as env so GitHub expression substitution
          # stays out of the shell body (no quoting hazards in the prompt).
          SCOPE_INSTRUCTION: ${{ steps.scope.outputs.instruction }}
          CACHE_SKIP: ${{ steps.cacheplan.outputs.cache_skip }}
        run: |
          # Assemble the prompt: static body via a quoted heredoc (no expansion),
          # then the dynamic scope/cache directives appended from env.
          cat > eval-prompt.txt <<'PROMPT'
          Run the review agents against every fixture in
          .claude/evals/fixtures/ whose paired .claude/evals/expected/<stem>.json
          declares an applicableAgents (or applicableSkills) target, using the
          /review-agent skill for agent fixtures and the test-design-advisor
          skill for skill fixtures.

          Do NOT grade. Record each agent's/skill's raw output and write it to
          a file named actuals.json at the repository root, in EXACTLY this
          shape (keyed by fixture stem — the expected filename without .json):

            {
              "<stem>": {
                "agents": {
                  "<agent>": { "status": "...",
                               "issues": [{ "severity": "...", "message": "..." }],
                               "summary": "..." }
                },
                "skills": {
                  "<skill>": { "report": "full advisor report text",
                               "gates": ["A"], "layers": ["unit"] }
                }
              }
            }

          Include only the block(s) (agents/skills) that the fixture targets.
          Write valid JSON and nothing else to actuals.json.
          PROMPT
          printf '\n%s\n%s\n' "$SCOPE_INSTRUCTION" "$CACHE_SKIP" >> eval-prompt.txt

          # Bare-CLI headless dispatch. A non-zero exit must NOT hard-fail the
          # job — the grade step below treats a missing/empty actuals.json as a
          # skip, keeping the opt-in gate non-blocking on dispatch trouble.
          claude -p "$(cat eval-prompt.txt)" \
            --output-format json \
            --max-turns 60 \
            --model claude-sonnet-4-6 \
            --allowedTools "Read" "Glob" "Grep" "Write" "Agent" "Skill(review-agent *)" "Skill(test-design-advisor *)" \
            || echo "::warning title=live dispatch exited non-zero::The claude CLI returned an error; grading treats a missing actuals.json as a skip."

      # Merge the cache-replayed pairs (replay.json, #311) into whatever the
      # dispatch recorded, so the grader sees the full pair set — replayed
      # passes plus freshly-dispatched misses. Dispatched actuals win on any
      # key collision (a freshly-run pair supersedes its cached copy).
      - name: Merge replayed cache hits into actuals
        if: steps.cred.outputs.run_live == 'true'
        run: |
          [ -f replay.json ] || echo '{}' > replay.json
          [ -f actuals.json ] && jq -e . actuals.json >/dev/null 2>&1 || echo '{}' > actuals.json
          # jq's `*` recursively merges objects (RHS wins): union stems and
          # agents/skills blocks, with freshly-dispatched values overriding the
          # replayed cache copies on any collision.
          jq -s '.[0] * .[1]' replay.json actuals.json > merged-actuals.json
          mv merged-actuals.json actuals.json
          echo "merged actuals (replay ∪ dispatched):"
          jq -r 'keys[]' actuals.json | sed 's/^/  · /' || true

      - name: Grade against baseline (or skip if dispatch produced nothing)
        if: steps.cred.outputs.run_live == 'true'
        run: |
          # If the bare-CLI dispatch produced no parseable actuals.json (it
          # exited non-zero, wrote nothing, or every pair replayed from an empty
          # cache), treat it as a skip — not a failure — so dispatch trouble does
          # not red-line PRs on the opt-in gate. With the replay cache (#311), an
          # all-hits run still produces a populated actuals.json from replay.json,
          # so grading proceeds with zero dispatch.
          if [ ! -s actuals.json ] || ! jq -e 'keys|length>0' actuals.json >/dev/null 2>&1; then
            echo "::warning title=live eval did not run::No parseable" \
              "actuals.json was produced and the replay cache was empty — the" \
              "claude CLI dispatch wrote no file or exited early. Skipping the" \
              "grade rather than failing the opt-in gate; check the dispatch" \
              "step log above."
            exit 0
          fi
          # Honor the quarantine (#233): flaky pairs recorded by a multi-trial
          # harvest (eval_variance) inform but must NOT block the gate. The grader
          # treats a missing quarantine.json as an empty set, so this is safe
          # before the first harvest commits one.
          python3 scripts/eval_grade.py \
            --actuals actuals.json \
            --baseline evals/baseline.json \
            --quarantine evals/quarantine.json \
            --only "${{ steps.scope.outputs.only }}"

      # Write freshly-PASSed pairs back to the replay cache (#311). Runs even if
      # grading found a regression (if: always) so green pairs from this run are
      # still memoized; the gate's pass/fail is decided by the grade step above.
      - name: Store passing pairs to replay cache
        if: steps.cred.outputs.run_live == 'true' && always()
        run: |
          [ -s actuals.json ] && jq -e 'keys|length>0' actuals.json >/dev/null 2>&1 || exit 0
          python3 scripts/eval_cache.py --store \
            --actuals actuals.json \
            --baseline evals/baseline.json \
            --only "${{ steps.scope.outputs.only }}" || true

      # Upload the updated cache as a workflow artifact for inspection. The
      # functional restore/save across runs is handled by actions/cache above;
      # this makes the per-run cache state downloadable.
      - name: Upload eval replay cache artifact
        if: steps.cred.outputs.run_live == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-replay-cache-${{ github.run_id }}
          path: evals/.eval-cache.json
          if-no-files-found: ignore
          retention-days: 7

  integration-gate:
    name: Integration eval tier (golden-repo, opt-in)
    runs-on: ubuntu-latest
    needs: structural-gate
    # Opt-in tier (#313): dispatches the orchestrator in an ephemeral worktree
    # for each integration fixture, runs the fixture's test commands, and grades
    # on exit codes. NEVER in the default PR suite — it pays full orchestrator
    # cost — so it runs only with the 'run-integration' label or a force_integration
    # dispatch, and only when ANTHROPIC_API_KEY is present.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to run the integration tier
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-integration') }}
          FORCE_INTEGRATION: ${{ github.event.inputs.force_integration }}
        run: |
          if { [ "$HAS_LABEL" = "true" ] || [ "$FORCE_INTEGRATION" = "true" ]; } \
             && [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_integration=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Integration tier not triggered — notice
        if: steps.gate.outputs.run_integration != 'true'
        run: |
          echo "::notice title=integration tier not triggered::" \
            "Add the 'run-integration' label (or dispatch with force_integration)" \
            "and configure ANTHROPIC_API_KEY to run the golden-repo integration" \
            "tier. See issue #313 and evals/README.md."

      - name: Install tooling
        if: steps.gate.outputs.run_integration == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          # The runner dispatches the orchestrator via the `claude` CLI. Install
          # it; the runner errors clearly (naming the component) if it is absent.
          npm install -g @anthropic-ai/claude-code || true

      # Restore the replay cache (#311) so unchanged integration pairs replay
      # instead of paying full orchestrator cost.
      - name: Restore eval replay cache
        if: steps.gate.outputs.run_integration == 'true'
        uses: actions/cache@v5
        with:
          path: evals/.eval-cache.json
          key: eval-cache-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            eval-cache-${{ github.head_ref || github.ref_name }}-

      - name: Run integration tier (records actuals.json)
        if: steps.gate.outputs.run_integration == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/run_integration_eval.py \
            --expected-dir evals/expected \
            --fixtures-dir evals/fixtures \
            --out integration-actuals.json

      - name: Grade integration results
        if: steps.gate.outputs.run_integration == 'true'
        run: |
          python3 scripts/eval_grade.py \
            --actuals integration-actuals.json \
            --baseline evals/baseline.json \
            --quarantine evals/quarantine.json

      - name: Store passing integration pairs to replay cache
        if: steps.gate.outputs.run_integration == 'true' && always()
        run: |
          [ -s integration-actuals.json ] || exit 0
          python3 scripts/eval_cache.py --store \
            --actuals integration-actuals.json \
            --baseline evals/baseline.json || true
