name: agent-eval-gate

# Agent-eval regression gate (issue #99).
#
# The review agents are the non-deterministic, untested part of the system.
# /agent-eval verifies their detection accuracy but only runs when a human
# remembers. This gate runs on every PR that touches the agents, skills,
# knowledge, or the eval corpus itself.
#
# Two tiers, by design:
#   1. STRUCTURAL gate (always, model-free): corpus integrity + the
#      deterministic grader's own unit tests. Cheap, hermetic, never flakes.
#   2. LIVE gate (only when ANTHROPIC_API_KEY is configured): actually
#      dispatches the agents against the fixtures, grades the recorded
#      outputs against evals/expected/*.json, and fails on any regression
#      vs evals/baseline.json. Costs model tokens, so it is opt-in via the
#      presence of the secret and degrades gracefully (skipped, not failed)
#      when the model API is unavailable.

on:
  pull_request:
    paths:
      - "plugins/dev-team/agents/**"
      - "plugins/dev-team/skills/**"
      - "plugins/dev-team/knowledge/**"
      - "evals/**"
      - "scripts/eval_grade.py"
      - ".github/workflows/agent-eval.yml"
  push:
    branches: [main]
    paths:
      - "plugins/dev-team/agents/**"
      - "plugins/dev-team/skills/**"
      - "plugins/dev-team/knowledge/**"
      - "evals/**"
      - "scripts/eval_grade.py"

jobs:
  structural-gate:
    name: Structural gate (model-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq

      - name: Eval corpus integrity check
        run: python3 scripts/eval_grade.py --check-corpus

      - name: Grader unit tests
        run: bats tests/repo/eval_grader_tests.bats

  semver-contract:
    name: Eval-corpus semver contract (issue #101)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify corpus change vs. commit type
        run: |
          # The eval corpus is the prompt's semver contract: editing an
          # existing expected value is a behavioral break (major); adding new
          # expectations is additive (minor); GREEN-preserving is patch. Assert
          # the PR's conventional-commit type matches.
          bash scripts/eval_semver_classify.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  live-gate:
    name: Live regression gate (model-dependent)
    runs-on: ubuntu-latest
    needs: structural-gate
    steps:
      - uses: actions/checkout@v6

      - name: Decide whether to run the live gate
        id: cred
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Explicit opt-in. The live gate dispatches the real agents (costs
          # tokens) and requires the Claude Code runner to be wired into the
          # "Run agent-eval" step below. It is OFF until a maintainer sets the
          # repo/environment variable RUN_LIVE_AGENT_EVAL=true. Merely having
          # the API key present is NOT enough — otherwise an unwired seam would
          # red-line every PR.
          RUN_LIVE_AGENT_EVAL: ${{ vars.RUN_LIVE_AGENT_EVAL }}
        run: |
          if [ "$RUN_LIVE_AGENT_EVAL" = "true" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "run_live=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Live gate not enabled — notice (structural gate still ran)
        if: steps.cred.outputs.run_live != 'true'
        run: |
          echo "::notice title=agent-eval live gate not enabled::" \
            "The model-free structural gate ran. To enable per-PR live agent" \
            "regression detection, wire the Claude Code runner into the" \
            "'Run agent-eval' step and set the repo variable" \
            "RUN_LIVE_AGENT_EVAL=true (ANTHROPIC_API_KEY must also be set)." \
            "See issue #99 and evals/README.md."

      # --- Live path (opt-in via RUN_LIVE_AGENT_EVAL) ----------------------
      # Budget: a 1-trial smoke run over the fixtures touched by the PR. The
      # runner records each agent's JSON output into actuals.json (keyed by
      # fixture stem), then the deterministic grader compares against
      # evals/baseline.json and fails the job on any regression with a
      # readable diff. Multi-trial quorum and per-agent thresholds are layered
      # in by issue #103's variance data.
      - name: Install tooling
        if: steps.cred.outputs.run_live == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run agent-eval (records actuals.json)
        if: steps.cred.outputs.run_live == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # The eval dispatch requires the Claude Code runner. This step is a
          # placeholder seam: wire the Claude Code GitHub Action here to run
          # `/agent-eval` and emit actuals.json in the grader's input shape
          # (see scripts/eval_grade.py header). Opting in via
          # RUN_LIVE_AGENT_EVAL=true without wiring it is a misconfiguration,
          # so fail loudly here rather than pass a live gate that did nothing.
          if [ ! -f actuals.json ]; then
            echo "::error title=live eval not wired::RUN_LIVE_AGENT_EVAL is" \
              "true but actuals.json was not produced. Wire the Claude Code" \
              "action into this step."
            exit 1
          fi

      - name: Grade against baseline
        if: steps.cred.outputs.run_live == 'true'
        run: |
          python3 scripts/eval_grade.py \
            --actuals actuals.json \
            --baseline evals/baseline.json
