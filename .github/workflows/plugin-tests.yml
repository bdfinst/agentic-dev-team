name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR or ref so rapid pushes don't stack
# redundant CI (mirrors the concurrency block already in agent-eval.yml).
concurrency:
  group: plugin-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: Shell scripts & suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Restore the apt download cache so a warm run skips re-fetching the .deb
      # archives. apt-get update still refreshes the package lists; only the
      # downloads are served from cache. Keyed on the workflow files + OS so a
      # workflow edit invalidates it. (Issue #467.)
      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      # Shellcheck (helpers, test scripts, the repo audit script) + the
      # security-assessment shell suite — defined once in scripts/ci-local.sh so
      # CI and the local pre-push gate run identical checks.
      - name: Shell checks (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_shellcheck_helpers,chk_shellcheck_tests,chk_sa_shell_suite

  bats-tests:
    name: Plugin content & hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install bats + jq
        # Across-file parallelism comes from scripts/run-bats-parallel.sh
        # (xargs -P, built into the runner) — no GNU `parallel` package needed,
        # so local pre-push and CI use the exact same portable mechanism. The
        # job id stays `bats-tests`; its required-status-check context is the
        # job name "Plugin content & hooks".
        run: sudo apt-get update && sudo apt-get install -y bats jq python3-yaml

      # Content-validation suites: repo invariants, knowledge-index shape,
      # agent knowledge-anchor citations (AC19), command/doc registry sync.
      # Pure bash/jq/python3 — no external toolchains.
      #
      # tests/hooks/ is intentionally excluded: its mutation-gate end-to-end
      # tests require stryker/pitest and its overhead tests are timing-based,
      # neither of which is portable to a clean CI runner.
      # Markdown reference integrity: a skill/agent/knowledge file that names a
      # real repo file by a path which resolves nowhere (a rename left behind, a
      # bare subdir path the runtime reads file-relative) fails here with the
      # exact references listed — the class that broke /ship's decision-defaults
      # screen. Runs before the bats suite (which also asserts it) so a failure
      # prints the offenders and fails fast.
      # Markdown reference integrity, the dev-team content bats suites
      # (tests/repo + knowledge/agents/commands/docs/scripts), skills-catalog
      # freshness, the rules-vs-prompts boundary sensor (#118), and the
      # toolchain-free hook-conformance bats (model-routing #104, /version) —
      # all defined once in scripts/ci-local.sh so CI and the local pre-push
      # gate can't drift. Tests/hooks mutation-gate suites are still excluded
      # (they need stryker/pitest); only the pure bash+python+jq ones run.
      - name: Content + hook-conformance checks (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_md_references,chk_bats_repo,chk_bats_content_rest,chk_skills_index,chk_rules_vs_prompts,chk_model_routing

  # Cost-regression gate (#140 mechanism, #171 real baseline). Isolated in its
  # own job so the read-only telemetry deploy key is never in scope for the
  # broader test jobs. The self-test step always runs (blocking); the telemetry
  # clone + real cross-machine baseline only run where the secret is available.
  cost-regression:
    name: Cost regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install python3 + jq
        run: sudo apt-get update && sudo apt-get install -y jq python3

      # Secrets are NOT exposed to forked-PR runs, so the deploy key (and thus
      # the real cross-machine baseline) is only available on branches in this
      # repo and on internal PRs. Fork PRs skip the next two steps and fall back
      # to the blocking self-test below. Coverage boundary documented in
      # plugins/dev-team/docs/telemetry-ci-access.md.
      - name: Load telemetry deploy key (read-only)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TELEMETRY_DEPLOY_KEY }}

      - name: Clone telemetry (read-only) and build the cross-machine cost baseline
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: |
          git clone --depth 1 git@github.com:bdfinst/agent-telemetry.git /tmp/telemetry
          python3 scripts/session_extract.py --cost-log /tmp/telemetry/digests \
            -o /tmp/telemetry-cost-log.jsonl
          echo "COST_BASELINE_LOG=/tmp/telemetry-cost-log.jsonl" >> "$GITHUB_ENV"

      # Self-tests the mechanism (blocking). When the baseline above was built,
      # the script ALSO runs the real regression of the latest session against
      # the cross-machine rolling mean — warn-only, since a non-deterministic
      # meter must not hard-fail an unrelated code PR. Fork PRs reach here with
      # no baseline and get the self-test only.
      - name: Run cost-regression check (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_cost_regression

  # Per-rule semgrep fixture measurement (#124): runs semgrep over the
  # positive/negative fixtures of the 36 custom rules to MEASURE real behaviour
  # (not just file presence, which the bats job covers). Heavier than the
  # bats/jq/python gate — semgrep install — so it is its own job.
  semgrep-fixtures:
    name: Semgrep rule fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Restore pip's wheel/download cache so a warm run reinstalls semgrep from
      # cache instead of re-downloading it. Keyed on the workflow files + OS.
      # (Issue #467.)
      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install semgrep + pyyaml
        run: pip install --quiet semgrep pyyaml

      # Fails if a rule is missing a fixture, a working rule's negative fires
      # (measured fp_rate > 0.10 — the demotion trigger), a non-known-broken
      # rule's positive fires on nothing, or a known-broken entry now works.
      - name: Measure custom semgrep rule fixtures (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_semgrep_fixtures

  # Lightweight smoke test for the red-team harness: guards the orchestrator
  # self-bootstrap + probe-loader wiring (relative imports must resolve so the
  # harness can run at all). Exercises only import/dispatch and the zero-HTTP
  # --dry-run path, so the sole runtime dep is httpx (numpy/scipy/scikit-learn
  # are used lazily inside probe run() bodies the smoke test never reaches).
  harness-smoke:
    name: Red-team harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install harness runtime dependency (httpx)
        run: pip install --quiet httpx

      - name: Red-team harness smoke test (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_harness_smoke
