name: Plugin tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR or ref so rapid pushes don't stack
# redundant CI (mirrors the concurrency block already in agent-eval.yml).
concurrency:
  group: plugin-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job here writes anything — read-only is sufficient for every job,
# matching link-check.yml's and pr-title-lint.yml's `contents: read` blocks
# (other workflows in this repo declare permissions too, but for jobs that
# actually write — docs.yml and epic-auto-close.yml are not read-only
# exemplars).
permissions:
  contents: read

jobs:
  shell-tests:
    name: Shell scripts & suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-python-only.py diffs against origin/main (git diff
          # base...HEAD); a shallow (depth-1) checkout has no origin/main ref
          # to diff against. Fetch full history so that ref resolves.
          fetch-depth: 0

      # Restore the apt download cache so a warm run skips re-fetching the .deb
      # archives. apt-get update still refreshes the package lists; only the
      # downloads are served from cache. Keyed on the workflow files + OS so a
      # workflow edit invalidates it. (Issue #467.)
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      # Shellcheck (helpers, test scripts, the repo audit script) + the
      # security-assessment shell suite + the prefer-Python-over-bash gate
      # (needs git diff against origin/main, hence fetch-depth: 0 above) —
      # defined once in scripts/ci-local.sh so CI and the local pre-push gate
      # run identical checks.
      - name: Shell checks (via ci-local)
        run:
          bash scripts/ci-local.sh
          --only=chk_shellcheck_helpers,chk_shellcheck_tests,chk_sa_shell_suite,chk_python_only

  content-guard-tests:
    name: Plugin content & hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install jq + pytest
        # `pytest` was added when the plugin's hook implementations moved
        # from bash to Python (#572); the unit tests under
        # plugins/dev-team/tests/ replace the retired `chk_model_routing`
        # bats suite. bats-core itself is retired (#677) — every
        # content-guard suite is now pytest, so this job no longer installs
        # it. `pytest-asyncio` is required by tests/scripts/test_orchestrator.py's
        # @pytest.mark.asyncio tests, folded into chk_hook_units by #677 when
        # tests/scripts/ was wired into CI for the first time.
        # --ignore-installed: pytest-asyncio pulls in typing-extensions, which
        # the runner image already has via apt (no RECORD file, so pip can't
        # uninstall it to upgrade in place) — install alongside it instead of
        # trying to replace it.
        run: |
          sudo apt-get update && sudo apt-get install -y jq python3-yaml python3-pip
          sudo python3 -m pip install --ignore-installed pytest pytest-asyncio

      # Content-validation suites: repo invariants, knowledge-index shape,
      # agent knowledge-anchor citations (AC19), command/doc registry sync.
      # Pure bash/jq/python3 — no external toolchains.
      #
      # tests/hooks/ is intentionally excluded: its mutation-gate end-to-end
      # tests require stryker/pitest and its overhead tests are timing-based,
      # neither of which is portable to a clean CI runner.
      # Markdown reference integrity: a skill/agent/knowledge file that names a
      # real repo file by a path which resolves nowhere (a rename left behind, a
      # bare subdir path the runtime reads file-relative) fails here with the
      # exact references listed — the class that broke /ship's decision-defaults
      # screen. Runs before the content-guard suite (which also asserts it) so a
      # failure prints the offenders and fails fast.
      # Markdown reference integrity, the dev-team content-guard pytest suites
      # (tests/repo + knowledge/agents/commands/docs/scripts), skills-catalog
      # freshness, and the rules-vs-prompts boundary sensor (#118) — all defined
      # once in scripts/ci-local.sh so CI and the local pre-push gate can't
      # drift. Tests/hooks mutation-gate suites are still excluded (they need
      # stryker/pitest); only the pure bash+python+jq ones run.
      # chk_sa_mcp_tools joined this list in #1676: it sits in ci-local.sh's
      # always-run CHECKS array but was named by no CI job, and it is
      # stdlib-only Python needing nothing this job does not already install.
      # chk_harness_scope is NOT here for exactly that reason — its checks 5-6
      # shell out to the red-team orchestrator, which imports httpx. It runs in
      # the harness-smoke job below, which installs it.
      - name: Content + hook-conformance checks (via ci-local)
        run:
          bash scripts/ci-local.sh
          --only=chk_md_references,chk_skills_index,chk_rules_vs_prompts,chk_hook_units,chk_sa_mcp_tools

  # ADR 0031's Python 3.10 floor (raised from ADR 0014's original 3.8 once that
  # floor's OS-availability rationale expired — see issue #1679), proven by
  # running it (#1635). Isolated in its own job, matching semgrep-fixtures' and
  # cost-regression's precedent below: it needs a toolchain (a 3.10
  # interpreter) the other jobs don't provision.
  # A first attempt at the original 3.8-era job co-tenanted it in
  # content-guard-tests via actions/setup-python, which put that
  # interpreter's bin dir on PATH ahead of the system python3 for every other
  # step in that job — breaking chk_md_references (needs 3.9+
  # str.removeprefix) and silently degrading chk_hook_units's pytest guard to
  # "skipped". `uv` avoids that entirely: `uv python install 3.10` only adds
  # 3.10 to uv's own managed toolchain (found via `_resolve_python310`'s
  # existing `uv python find 3.10` branch in ci-local.sh) and never touches
  # PATH's `python3`.
  #
  # This job's `name:` IS the status-check context branch protection matches
  # on, and it is listed as a required check in the `main` ruleset (same
  # convention as agent-eval.yml and pr-title-lint.yml), so a red run here
  # blocks merge — which is what catches a push that bypassed local hooks.
  # A rename here needs a matching ruleset update, or the check silently
  # stops blocking while still reporting green.
  python-floor:
    name: Python 3.10 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python 3.10 floor check (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_python_floor

  # The other end of the supported range (#1837). The floor job above asks
  # "does this still run on the OLDEST supported interpreter"; nothing asked
  # about the newest, and content-guard-tests runs on the runner image's
  # implicit system python3 (~3.12 on ubuntu-24.04, with no python-version pin
  # anywhere in this file). So the suite's green read as "works on Python" when
  # it meant "works on 3.10 and whatever the runner happens to ship."
  #
  # That gap was not hypothetical: `main` was red on 3.13+ while every check
  # here was green. coverage_discovery_js.py detected a malformed `**` glob by
  # catching ValueError from Path.glob, and CPython 3.13's pathlib rewrite
  # stopped raising it — so the guard silently returned an empty result instead
  # of a discovery_error (#1832, fixed in #1833).
  #
  # Follows python-floor's `uv` precedent deliberately, and NOT
  # actions/setup-python inside content-guard-tests: see the comment above that
  # job for the prior attempt, which put a pinned interpreter ahead of the
  # system python3 for every other step in the job, broke chk_md_references and
  # silently degraded chk_hook_units's pytest guard to "skipped".
  #
  # The pinned version lives in one place (PYTHON_CEILING in ci-local.sh) so a
  # runner-image bump cannot move it silently and raising it is a deliberate
  # edit. This gate runs the FULL pytest directory list rather than the floor
  # job's narrow slice, because the regression that motivated it was in a test
  # file that slice does not include — a ceiling gate on the slice alone would
  # have reported green on the exact bug it exists to catch.
  python-ceiling:
    name: Python ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python ceiling check (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_python_ceiling

  # Cost-regression gate (#140 mechanism, #171 real baseline). Isolated in its
  # own job so the read-only telemetry deploy key is never in scope for the
  # broader test jobs. The self-test step always runs (blocking); the telemetry
  # clone + real cross-machine baseline only run where the secret is available.
  cost-regression:
    name: Cost regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install python3 + jq
        run: sudo apt-get update && sudo apt-get install -y jq python3

      # Secrets are NOT exposed to forked-PR runs, so the deploy key (and thus
      # the real cross-machine baseline) is only available on branches in this
      # repo and on internal PRs. Fork PRs skip the next two steps and fall back
      # to the blocking self-test below. Coverage boundary documented in
      # plugins/dev-team/docs/telemetry-ci-access.md.
      - name: Load telemetry deploy key (read-only)
        if:
          ${{ github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.fork == false && github.actor !=
          'dependabot[bot]') }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TELEMETRY_DEPLOY_KEY }}

      - name:
          Clone telemetry (read-only) and build the cross-machine cost baseline
        if:
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.fork == false }}
        run: |
          git clone --depth 1 git@github.com:bdfinst/agent-telemetry.git /tmp/telemetry
          python3 scripts/session_extract.py --cost-log /tmp/telemetry/digests \
            -o /tmp/telemetry-cost-log.jsonl
          echo "COST_BASELINE_LOG=/tmp/telemetry-cost-log.jsonl" >> "$GITHUB_ENV"

      # Self-tests the mechanism (blocking). When the baseline above was built,
      # the script ALSO runs the real regression of the latest session against
      # the cross-machine rolling mean — warn-only, since a non-deterministic
      # meter must not hard-fail an unrelated code PR. Fork PRs reach here with
      # no baseline and get the self-test only.
      - name: Run cost-regression check (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_cost_regression

  # Per-rule semgrep fixture measurement (#124): runs semgrep over the
  # positive/negative fixtures of the 36 custom rules to MEASURE real behaviour
  # (not just file presence, which the content-guard-tests job covers). Heavier
  # than the jq/python gate — semgrep install — so it is its own job.
  semgrep-fixtures:
    name: Semgrep rule fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Restore pip's wheel/download cache so a warm run reinstalls semgrep from
      # cache instead of re-downloading it. Keyed on the workflow files + OS.
      # (Issue #467.)
      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install semgrep + pyyaml
        run: pip install --quiet semgrep pyyaml

      # Fails if a rule is missing a fixture, a working rule's negative fires
      # (measured fp_rate > 0.10 — the demotion trigger), a non-known-broken
      # rule's positive fires on nothing, or a known-broken entry now works.
      - name: Measure custom semgrep rule fixtures (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_semgrep_fixtures

  # Lightweight smoke test for the red-team harness: guards the orchestrator
  # self-bootstrap + probe-loader wiring (relative imports must resolve so the
  # harness can run at all). Exercises only import/dispatch and the zero-HTTP
  # --dry-run path, so the sole runtime dep is httpx (numpy/scipy/scikit-learn
  # are used lazily inside probe run() bodies the smoke test never reaches).
  harness-smoke:
    name: Red-team harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install harness runtime dependency (httpx)
        run: pip install --quiet httpx

      - name: Red-team harness smoke test (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_harness_smoke,chk_harness_scope

  # Both language linters (#1676). They were declared in ci-local.sh's
  # always-run CHECKS array but named by NO CI job's --only= list, so they ran
  # only on a contributor machine with a working pre-push hook — and only at
  # whatever linter version happened to resolve there. scripts/verify_toolchain.py
  # reached main carrying 20 ruff findings that way.
  #
  # ruff is installed from requirements-dev.txt, which pins it exactly, and
  # chk_ruff invokes `python3 -m ruff` rather than a PATH binary, so this job
  # and a contributor's machine cannot disagree about what "clean" means.
  #
  # This job's `name:` is a required status-check context in the `main`
  # ruleset — renaming it here without updating the ruleset leaves a check
  # that still reports but no longer blocks.
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pinned ruff
        run: pip install --quiet "$(grep -E '^ruff==' requirements-dev.txt)"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install node dev dependencies (eslint)
        run: npm ci

      - name: Lint checks (via ci-local)
        run: bash scripts/ci-local.sh --only=chk_ruff,chk_eslint
