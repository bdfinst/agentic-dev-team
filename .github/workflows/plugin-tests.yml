name: plugin-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Shellcheck security-assessment helper scripts
        run: |
          shellcheck -x plugins/security-assessment/scripts/*.sh

      - name: Shellcheck test files
        run: |
          shellcheck plugins/security-assessment/tests/scripts/*.sh

      - name: Shellcheck repo audit scripts
        run: |
          shellcheck scripts/audit-rules-vs-prompts.sh

      - name: Run tests/scripts/run-all.sh
        run: bash plugins/security-assessment/tests/scripts/run-all.sh

  bats-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq python3-yaml

      # Content-validation suites: repo invariants, knowledge-index shape,
      # agent knowledge-anchor citations (AC19), command/doc registry sync.
      # Pure bash/jq/python3 — no external toolchains.
      #
      # tests/hooks/ is intentionally excluded: its mutation-gate end-to-end
      # tests require stryker/pitest and its overhead tests are timing-based,
      # neither of which is portable to a clean CI runner.
      - name: Run dev-team content tests (bats)
        run: |
          bats \
            tests/repo/ \
            tests/knowledge/ \
            tests/agents/ \
            tests/commands/ \
            tests/docs/ \
            tests/scripts/

      # Rules-vs-prompts boundary sensor (#118): the security-review-rule-map.yaml
      # policy must stay consistent — no class on two surfaces, every rule-surface
      # class has fixtures + a measured fp_rate <= 10%.
      - name: Run rules-vs-prompts audit
        run: bash scripts/audit-rules-vs-prompts.sh

      # Model-routing conformance: the updatedInput PreToolUse rewrite
      # contract (ADR-0004) is load-bearing and depends on undocumented
      # harness behavior. These hook tests are toolchain-free (bash + jq),
      # unlike the rest of tests/hooks/ which needs stryker/pitest — so they
      # run here as a CI gate. See issue #104.
      - name: Run model-routing hook conformance tests (bats)
        run: |
          bats \
            tests/hooks/updated_input_contract_tests.bats \
            tests/hooks/agent_model_resolve_hook_tests.bats \
            tests/hooks/model_resolve_tests.bats

  # Cost-regression gate (#140 mechanism, #171 real baseline). Isolated in its
  # own job so the read-only telemetry deploy key is never in scope for the
  # broader test jobs. The self-test step always runs (blocking); the telemetry
  # clone + real cross-machine baseline only run where the secret is available.
  cost-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install python3 + jq
        run: sudo apt-get update && sudo apt-get install -y jq python3

      # Secrets are NOT exposed to forked-PR runs, so the deploy key (and thus
      # the real cross-machine baseline) is only available on branches in this
      # repo and on internal PRs. Fork PRs skip the next two steps and fall back
      # to the blocking self-test below. Coverage boundary documented in
      # plugins/dev-team/docs/telemetry-ci-access.md.
      - name: Load telemetry deploy key (read-only)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TELEMETRY_DEPLOY_KEY }}

      - name: Clone telemetry (read-only) and build the cross-machine cost baseline
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: |
          git clone --depth 1 git@github.com:bdfinst/agent-telemetry.git /tmp/telemetry
          python3 scripts/session_extract.py --cost-log /tmp/telemetry/digests \
            -o /tmp/telemetry-cost-log.jsonl
          echo "COST_BASELINE_LOG=/tmp/telemetry-cost-log.jsonl" >> "$GITHUB_ENV"

      # Self-tests the mechanism (blocking). When the baseline above was built,
      # the script ALSO runs the real regression of the latest session against
      # the cross-machine rolling mean — warn-only, since a non-deterministic
      # meter must not hard-fail an unrelated code PR. Fork PRs reach here with
      # no baseline and get the self-test only.
      - name: Run cost-regression check
        run: bash scripts/cost-regression-check.sh

  # Per-rule semgrep fixture measurement (#124): runs semgrep over the
  # positive/negative fixtures of the 36 custom rules to MEASURE real behaviour
  # (not just file presence, which the bats job covers). Heavier than the
  # bats/jq/python gate — semgrep install — so it is its own job.
  semgrep-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install semgrep + pyyaml
        run: pip install --quiet semgrep pyyaml

      # Fails if a rule is missing a fixture, a working rule's negative fires
      # (measured fp_rate > 0.10 — the demotion trigger), a non-known-broken
      # rule's positive fires on nothing, or a known-broken entry now works.
      - name: Measure custom semgrep rule fixtures
        run: python3 plugins/security-assessment/scripts/audit-semgrep-fixtures.py
