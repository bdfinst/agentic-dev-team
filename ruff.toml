# Config for `ruff check` (wired into scripts/ci-local.sh's chk_ruff gate).

# Repo-root tooling (scripts/, tests/) runs on a maintainer's or CI's
# interpreter, never a user's, so it is deliberately NOT held to the shipped
# floor — root CLAUDE.md puts it outside ADR 0014's scope. py39 is what the
# existing suite already uses (parenthesized `with`).
target-version = "py311"

# The shipped floor itself is declared in [per-file-target-version] at the
# bottom of this file — TOML puts every key after a table header inside that
# table, so it cannot live up here.

# extend-exclude adds to ruff's built-in default exclude list rather than
# replacing it. Every entry here is a corpus of intentionally non-conformant
# or frozen snapshot Python that lint debt should never accrue against:
#   - **/rule-fixtures, **/fixtures, **/fixture, **/fixture-repo: semgrep rule
#     positive/negative snippets and eval-harness fixture repos — demonstration
#     code, not maintained source.
#   - **/acc_*.py: acceptance-test files "injected at grading" by the TDD/
#     refactor-granularity experiment harnesses (evals/fixtures/exp-tdd-*,
#     evals/refactor-granularity/tasks/*) — frozen grading corpora.
#   - evals/refactor-granularity/tasks/*/{golden,reference}: canonical
#     solution snapshots for the same experiment corpus.
extend-exclude = [
    "**/fixtures",
    "**/fixture",
    "**/fixture-repo",
    "**/rule-fixtures",
    "**/acc_*.py",
    "evals/refactor-granularity/tasks/*/golden",
    "evals/refactor-granularity/tasks/*/reference",
]

# E402 (module-level import not at top of file) is suppressed for the paths
# below because they rely on the `sys.path.insert(0, ...); import module`
# idiom to import sibling scripts/libs that aren't installed as packages —
# a deliberate pattern in this repo's hooks/scripts/tests, not lint debt.
[lint.per-file-ignores]
"tests/**" = ["E402"]
"plugins/dev-team/tests/**" = ["E402"]
"plugins/dev-team/hooks/**" = ["E402"]
"plugins/dev-team/scripts/**" = ["E402"]
"plugins/dev-team/skills/agent-readiness/scanner.py" = ["E402"]
"scripts/**" = ["E402"]
"evals/custom-tools/validate.py" = ["E402"]

# THE shipped Python floor — the single machine-readable declaration of ADR
# 0031's "Python 3.10+, stdlib only" (raised from ADR 0014's original 3.8 once
# that floor's OS-availability rationale expired — see ADR 0031), and the
# Python analogue of package.json's `engines.node`. Scoped to the shipped tree
# because that is the only code a user's own Python ever executes.
#
# This stops ruff's autofixes from rewriting shipped code into 3.11+ syntax.
# It is NOT what proves the floor holds: that is the "Python 3.10 floor" job
# in .github/workflows/plugin-tests.yml, which byte-compiles and imports every
# shipped module on a real 3.10 interpreter, and (since issue #1650) also
# actually runs the shipped-agent-script test slice under that interpreter —
# closing the byte-compile+import blind spot to runtime-only API usage inside
# a function body. The interpreter is the oracle — neither a linter setting
# nor a hand-maintained list of "APIs newer than the floor" can be trusted to
# know what the floor version accepts. The original 3.8-era gate proved that
# the hard way: its list version passed a `dict | dict` merge which 3.8
# rejected outright.
#
# tests/repo/test_python_floor.py pins this value, the ADR, and that CI job
# together so the three cannot drift apart.
[per-file-target-version]
"plugins/dev-team/**" = "py310"

# plugins/security-assessment/harness/**'s own CLAUDE.md declares "Python
# >= 3.10 available (red-team harness requires it)" (checked by that plugin's
# install.sh) — a separate, real floor from ADR 0031's plugins/dev-team one,
# but the same reason: this harness runs on an end user's interpreter, not
# just a maintainer's/CI's. Without this entry ruff's default py311
# target-version would keep autofixing `timezone.utc` back into the 3.11-only
# `datetime.UTC` alias here (issue #1805).
"plugins/security-assessment/harness/**" = "py310"
