# security-review category -> unified-finding rule_id mapping
#
# Single source of truth for agent-emitted rule_ids. The adapter at
# plugins/dev-team/skills/static-analysis-integration/adapters/security-review-adapter.py
# reads this file. See skills/static-analysis-integration/references/security-review-adapter.md for the contract.
#
# Versioning is independent of the primitives-contract. Bump on any semantic change:
#   - patch: renumber / rename a rule_id that aliases an upstream rename
#   - minor: add a new mapping
#   - major: remove or move a mapping
version: 1.1.0
mappings:
  # Pattern-visible classes — adopt upstream rule_ids (rules-vs-prompts policy Q4).
  A02.weak-hashing-md5: semgrep.generic.weak-hash-md5
  A03.sql-injection: semgrep.generic.sql-injection
  A03.xss-innerhtml: semgrep.javascript.xss-innerhtml
  A03.command-injection: semgrep.generic.command-injection
  A08.binary-formatter: semgrep.csharp.binary-formatter
  A08.object-input-stream: semgrep.java.deserialization-object-input-stream
  A08.js-eval: semgrep.javascript.eval-injection
  A05.cors-wildcard: semgrep.generic.cors-wildcard
  A07.jwt-alg-none: semgrep.generic.jwt-alg-none
  A02.insecure-random-js: semgrep.javascript.weak-random
  A05.default-credentials: semgrep.generic.default-credentials

  # Judgment-only classes — security-review namespace.
  A01.idor: security-review.a01.idor
  A01.missing-auth-middleware: security-review.a01.missing-auth-middleware
  A01.missing-authorize-csharp: security-review.a01.missing-authorize-csharp
  A04.no-rate-limiting: security-review.a04.no-rate-limiting
  A04.no-brute-force-protection: security-review.a04.no-brute-force-protection
  A07.jwt-no-exp: security-review.a07.jwt-no-exp
  A07.session-fixation: security-review.a07.session-fixation
  A09.pii-in-logs: security-review.a09.pii-in-logs
  A05.verbose-errors-prod: security-review.a05.verbose-errors-prod
  A09.no-auth-event-logging: security-review.a09.no-auth-event-logging

# Policy-as-data: the rules-vs-prompts boundary, made structural (issue #118).
# This replaces the prose "classes that move to rules / stay in prompt / both"
# lists from the removed rules-vs-prompts-policy.md. The boundary is now
# queryable here and enforced by scripts/audit-rules-vs-prompts.sh.
#
#   surface: rule   — pattern-stable, detected by a semgrep rule; the agent does
#                     NOT re-detect (only assesses exploitability on tool findings)
#   surface: prompt — judgment class; detection needs cross-file/architectural
#                     reasoning, lives in the agent prompt + owasp-detection.md
#   surface: both   — a rule detects the pattern AND the agent assesses impact
#
# rule/both classes MUST carry a measured `fp_rate` (≤ 0.10 policy threshold)
# and a `fixtures` dir with ≥1 positive and ≥1 negative fixture.
classes:
  # --- rule-surface (pattern-visible; adopt upstream semgrep rule_ids) ---------
  A02.weak-hashing-md5:
    surface: rule
    fp_rate: 0.0
    fixtures: knowledge/rule-fixtures/A02.weak-hashing-md5
  A02.insecure-random-js:
    surface: rule
    fp_rate: 0.0
    fixtures: knowledge/rule-fixtures/A02.insecure-random-js
  A03.sql-injection:
    surface: rule
    fp_rate: 0.05
    fixtures: knowledge/rule-fixtures/A03.sql-injection
  A03.xss-innerhtml:
    surface: rule
    fp_rate: 0.0
    fixtures: knowledge/rule-fixtures/A03.xss-innerhtml
  A03.command-injection:
    surface: rule
    fp_rate: 0.05
    fixtures: knowledge/rule-fixtures/A03.command-injection
  A08.binary-formatter:
    surface: rule
    fp_rate: 0.0
    fixtures: knowledge/rule-fixtures/A08.binary-formatter
  A08.object-input-stream:
    surface: rule
    fp_rate: 0.0
    fixtures: knowledge/rule-fixtures/A08.object-input-stream
  A08.js-eval:
    surface: rule
    fp_rate: 0.05
    fixtures: knowledge/rule-fixtures/A08.js-eval
  A05.cors-wildcard:
    surface: rule
    fp_rate: 0.0
    fixtures: knowledge/rule-fixtures/A05.cors-wildcard
  A07.jwt-alg-none:
    surface: rule
    fp_rate: 0.0
    fixtures: knowledge/rule-fixtures/A07.jwt-alg-none
  A05.default-credentials:
    surface: rule
    fp_rate: 0.1
    fixtures: knowledge/rule-fixtures/A05.default-credentials
  # --- prompt-surface (judgment classes; no fixtures/fp_rate required) ---------
  A01.idor: { surface: prompt }
  A01.missing-auth-middleware: { surface: prompt }
  A01.missing-authorize-csharp: { surface: prompt }
  A04.no-rate-limiting: { surface: prompt }
  A04.no-brute-force-protection: { surface: prompt }
  A07.jwt-no-exp: { surface: prompt }
  A07.session-fixation: { surface: prompt }
  A09.pii-in-logs: { surface: prompt }
  A05.verbose-errors-prod: { surface: prompt }
  A09.no-auth-event-logging: { surface: prompt }
