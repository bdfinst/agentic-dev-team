<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1080" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">/test-modernize five-phase workflow</title>
  <desc id="desc">Vertical flowchart of the /test-modernize orchestrator. Approach contract resolves the sink (tracker CLI or local files). Phase 1 invokes /cd-test-architecture then /issues-from-assessment. Phase 2 invokes /gherkin-public. Phase 3 invokes /test-audit-disable then /coverage-baseline. Phase 4 invokes /build then /coverage-delta per Story. Phase 5 invokes /build, /mutation-testing, and /quality-targets-converge per Story until the four quality targets are met or waived. A human-gate diamond sits between every phase. The dev-team:test-modernization-review agent reviews each phase deliverable.</desc>
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="490" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">/test-modernize — five-phase workflow</text>
  <text x="490" y="46" text-anchor="middle" font-size="11" fill="#475569">Each phase ends at a human gate; resume any phase via /continue (memory/test-modernize/&lt;repo&gt;/phase-&lt;n&gt;.md)</text>

  <!-- Phase 0 -->
  <g filter="url(#shadow)">
    <rect x="340" y="68" width="300" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="490" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Phase 0 — Approach contract</text>
    <text x="490" y="108" text-anchor="middle" font-size="11" fill="#475569">Parent URL → tracker CLI probe</text>
    <text x="490" y="122" text-anchor="middle" font-size="11" fill="#475569">(fallback: local files in ./plans/test-modernize/)</text>
  </g>

  <!-- Phase 1 -->
  <g filter="url(#shadow)">
    <rect x="100" y="156" width="780" height="84" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="490" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Phase 1 — Analyze</text>
    <text x="490" y="198" text-anchor="middle" font-size="11" fill="#1E40AF">/cd-test-architecture → assessment report (components, gaps, seam-reachability, target architecture)</text>
    <text x="490" y="216" text-anchor="middle" font-size="11" fill="#1E40AF">/issues-from-assessment → parent + Phase-tagged children via gh / az / glab / acli</text>
    <text x="490" y="234" text-anchor="middle" font-size="11" fill="#1E40AF">dev-team:test-modernization-review --phase 1</text>
  </g>

  <!-- Gate 1 -->
  <g filter="url(#shadow)">
    <polygon points="490,258 600,290 490,322 380,290" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="490" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Human gate</text>
    <text x="490" y="302" text-anchor="middle" font-size="10" fill="#92400E">backlog review</text>
  </g>

  <!-- Phase 2 -->
  <g filter="url(#shadow)">
    <rect x="100" y="338" width="780" height="68" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="490" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Phase 2 — Specify public interface</text>
    <text x="490" y="380" text-anchor="middle" font-size="11" fill="#1E40AF">/gherkin-public → .feature files at every public boundary</text>
    <text x="490" y="398" text-anchor="middle" font-size="11" fill="#1E40AF">(API endpoint · UI flow · batch-job entry point · CLI · library export · event type)</text>
  </g>

  <!-- Gate 2 -->
  <g filter="url(#shadow)">
    <polygon points="490,422 600,454 490,486 380,454" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="490" y="451" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Human gate</text>
    <text x="490" y="466" text-anchor="middle" font-size="10" fill="#92400E">Gherkin sign-off</text>
  </g>

  <!-- Phase 3 -->
  <g filter="url(#shadow)">
    <rect x="100" y="502" width="780" height="84" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="490" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Phase 3 — Audit + baseline coverage</text>
    <text x="490" y="544" text-anchor="middle" font-size="11" fill="#1E40AF">/test-audit-disable → disable cannot-fail tests (skip + tag, never delete)</text>
    <text x="490" y="562" text-anchor="middle" font-size="11" fill="#1E40AF">/coverage-baseline → record line+branch %, post to parent / FEATURE.md</text>
    <text x="490" y="580" text-anchor="middle" font-size="11" fill="#1E40AF">dev-team:test-modernization-review --phase 3</text>
  </g>

  <!-- Gate 3 -->
  <g filter="url(#shadow)">
    <polygon points="490,602 600,634 490,666 380,634" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="490" y="631" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Human gate</text>
    <text x="490" y="646" text-anchor="middle" font-size="10" fill="#92400E">baseline accepted</text>
  </g>

  <!-- Phase 4 -->
  <g filter="url(#shadow)">
    <rect x="100" y="682" width="780" height="84" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="490" y="704" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Phase 4 — No-refactor adds</text>
    <text x="490" y="724" text-anchor="middle" font-size="11" fill="#1E40AF">For each Phase-4 Story → /build (TDD + /code-review)</text>
    <text x="490" y="742" text-anchor="middle" font-size="11" fill="#1E40AF">/coverage-delta after each Story → Δ vs. baseline (no production-code diffs allowed)</text>
    <text x="490" y="760" text-anchor="middle" font-size="11" fill="#1E40AF">dev-team:test-modernization-review --phase 4</text>
  </g>

  <!-- Gate 4 -->
  <g filter="url(#shadow)">
    <polygon points="490,782 600,814 490,846 380,814" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="490" y="811" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Human gate</text>
    <text x="490" y="826" text-anchor="middle" font-size="10" fill="#92400E">Δ-coverage accepted</text>
  </g>

  <!-- Phase 5 -->
  <g filter="url(#shadow)">
    <rect x="100" y="862" width="780" height="104" rx="10" fill="#FEF3F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="490" y="886" text-anchor="middle" font-size="13" font-weight="600" fill="#991B1B">Phase 5 — Refactor-for-testability + converge on quality targets</text>
    <text x="490" y="906" text-anchor="middle" font-size="11" fill="#9F1239">For each Phase-5 Story (baseline-green-first) → /build (minimum behavior-preserving refactor + new test)</text>
    <text x="490" y="924" text-anchor="middle" font-size="11" fill="#9F1239">/mutation-testing + /quality-targets-converge per Story</text>
    <text x="490" y="942" text-anchor="middle" font-size="11" font-weight="600" fill="#9F1239">Targets: line+branch ≥ 90% · zero surviving mutants · 100% deterministic · fastest pre-merge wall-clock</text>
    <text x="490" y="960" text-anchor="middle" font-size="11" fill="#9F1239">dev-team:test-modernization-review --phase 5</text>
  </g>

  <!-- Gate 5 -->
  <g filter="url(#shadow)">
    <polygon points="490,982 620,1018 490,1054 360,1018" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="490" y="1015" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Human gate</text>
    <text x="490" y="1030" text-anchor="middle" font-size="10" fill="#92400E">targets met (or each waived with reason)</text>
  </g>

  <!-- Arrows main column -->
  <line x1="490" y1="126" x2="490" y2="156" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="240" x2="490" y2="258" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="490" y1="322" x2="490" y2="338" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="406" x2="490" y2="422" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="490" y1="486" x2="490" y2="502" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="586" x2="490" y2="602" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="490" y1="666" x2="490" y2="682" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="766" x2="490" y2="782" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="490" y1="846" x2="490" y2="862" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="966" x2="490" y2="982" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
</svg>
