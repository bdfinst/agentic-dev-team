# Capability taxonomy for docs/skills.md.
#
# build_skills_index.py groups the skills catalog by these capabilities, in this
# order. Each skill's row (name, description) is still derived from its own
# SKILL.md frontmatter — this file only decides *which capability section* it
# lands in. A skill on disk that is not listed here falls into a trailing
# "Other" section; the freshness gate then shows it as a diff, prompting you to
# file it under the right capability and regenerate.
#
# Regenerate after editing: bash plugins/dev-team/hooks/lib/build-skills-index.sh

categories:
  - name: Specs and planning
    skills:
      [
        specs,
        plan,
        design-doc,
        design-interrogation,
        design-it-twice,
        api-design,
        gherkin-derive,
        gherkin-public,
        feature-file-validation,
        issues-from-plan,
        issues-from-assessment,
      ]

