site_name: Agentic Dev Team
site_url: https://devteam.bryanfinster.com/
repo_url: https://github.com/bdfinst/agentic-dev-team
repo_name: bdfinst/agentic-dev-team
edit_uri: edit/main/

docs_dir: _mkdocs_src
site_dir: site

# Surface nav/link problems during the build. MkDocs reserves `error` for a few
# checks and rejects it for `nav.not_found`, so the hard gate against a nav entry
# pointing at a missing file lives in the link-check workflow's nav-integrity
# step; this block keeps the build's own diagnostics visible. Cross-tree body
# links to files outside the assembled site (scripts/, sibling plugins) only warn.
validation:
  nav:
    not_found: warn
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn

extra_css:
  - stylesheets/sidebar.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # Render ```mermaid fences as diagrams. Material for MkDocs loads
      # Mermaid.js automatically once this custom fence is declared.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - attr_list

