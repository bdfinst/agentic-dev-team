site_name: Agentic Dev Team
site_url: https://devteam.bryanfinster.com/
repo_url: https://github.com/bdfinst/agentic-dev-team
repo_name: bdfinst/agentic-dev-team
edit_uri: edit/main/

docs_dir: _mkdocs_src
site_dir: site

# Surface nav/link problems during the build. MkDocs's `validation:` block
# only accepts warn/info/ignore per option (there is no per-option `error`
# level in this MkDocs version — confirmed against the installed
# mkdocs.config.defaults._LogLevel, which validates against exactly
# {"warn", "info", "ignore"}); the hard gate against a nav entry pointing at
# a missing file lives in the link-check workflow's nav-integrity step
# instead. This block keeps the build's own diagnostics visible.
validation:
  nav:
    not_found: warn
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn

extra_css:
  - stylesheets/sidebar.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy

plugins:
  - search
  # Nav is generated from the assembled docs tree (_mkdocs_src) at build time —
  # there is no hand-maintained `nav:` list. Per-directory `.pages` files
  # (assembled alongside their docs) set section titles and ordering; page
  # titles come from each doc's H1. Adding a doc adds it to the nav
  # automatically, which is why ADRs 0013+ no longer silently fall out.
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # Render ```mermaid fences as diagrams. Material for MkDocs loads
      # Mermaid.js automatically once this custom fence is declared.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - attr_list
